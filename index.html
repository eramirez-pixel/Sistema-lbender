<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión de Materiales • Colegio Lauretta Bender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

/* ===== TOKENS INSTITUCIONALES ===== */
:root {
  --verde-oscuro:    #1a5c2e;
  --verde-medio:     #226b38;
  --verde-claro:     #2e8a49;
  --verde-suave:     #d4edda;
  --verde-hover:     #144824;
  --amarillo:        #f5c800;
  --amarillo-hover:  #d9b200;
  --amarillo-suave:  #fff9d6;
  --blanco:          #ffffff;
  --gris-bg:         #f0f4f1;
  --gris-surface:    #f8faf8;
  --gris-borde:      #dde8df;
  --gris-texto:      #374151;
  --gris-muted:      #6b7280;
  --gris-faint:      #9ca3af;
  --sombra-sm:       0 1px 3px rgba(26,92,46,0.08), 0 1px 2px rgba(0,0,0,0.06);
  --sombra-md:       0 4px 12px rgba(26,92,46,0.10), 0 2px 4px rgba(0,0,0,0.06);
  --sombra-lg:       0 10px 30px rgba(26,92,46,0.12), 0 4px 8px rgba(0,0,0,0.08);
  --radius-sm:       6px;
  --radius-md:       10px;
  --radius-lg:       14px;
  --radius-xl:       20px;
  --radius-full:     9999px;
  --transition:      180ms cubic-bezier(0.16,1,0.3,1);
  --font-body:       'Inter', system-ui, sans-serif;
}

body {
  font-family: var(--font-body);
  background-color: var(--gris-bg);
  color: var(--gris-texto);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  background-image:
    radial-gradient(circle at 20% 80%, rgba(26,92,46,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(245,200,0,0.05) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231a5c2e' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, var(--verde-oscuro) 0%, var(--verde-medio) 60%, var(--verde-claro) 100%);
  color: white;
  padding: 0 28px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(26,92,46,0.25);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 3px solid var(--amarillo);
}

.header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M20 0L40 20L20 40L0 20z'/%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 1;
}

.header-logo {
  width: 46px;
  height: 46px;
  background: white;
  border-radius: 50%;
  padding: 3px;
  box-shadow: 0 0 0 2px var(--amarillo);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.header-title strong {
  display: block;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.header-title small {
  font-size: 11px;
  opacity: 0.8;
  font-weight: 400;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 1;
}

.user-chip {
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 5px 14px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
  backdrop-filter: blur(4px);
}

/* ===== BOTONES ===== */
.btn {
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-size: 13px;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-body);
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--verde-oscuro);
  color: white;
  box-shadow: 0 2px 6px rgba(26,92,46,0.25);
}
.btn-primary:hover { background: var(--verde-hover); box-shadow: 0 4px 10px rgba(26,92,46,0.3); }
.btn-amarillo {
  background: var(--amarillo);
  color: var(--verde-oscuro);
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(245,200,0,0.3);
}
.btn-amarillo:hover { background: var(--amarillo-hover); }
.btn-outline {
  background: transparent;
  color: var(--verde-oscuro);
  border: 1.5px solid var(--verde-oscuro);
}
.btn-outline:hover { background: var(--verde-suave); }
.btn-danger {
  background: #dc2626;
  color: white;
}
.btn-danger:hover { background: #b91c1c; }
.btn-success {
  background: #059669;
  color: white;
}
.btn-success:hover { background: #047857; }
.btn-blue {
  background: #0284c7;
  color: white;
}
.btn-blue:hover { background: #0369a1; }
.btn-ghost {
  background: transparent;
  color: var(--gris-muted);
  border: 1px solid var(--gris-borde);
}
.btn-ghost:hover { background: var(--gris-surface); color: var(--gris-texto); }
.btn-sm { padding: 5px 11px; font-size: 12px; border-radius: var(--radius-sm); }
.btn-lg { padding: 12px 24px; font-size: 15px; border-radius: var(--radius-lg); }

/* ===== CONTAINER ===== */
.container {
  max-width: 1120px;
  margin: 0 auto;
  padding: 24px 20px;
}

/* ===== TABS ===== */
.tabs-wrap {
  background: white;
  border-radius: var(--radius-xl);
  padding: 5px;
  margin-bottom: 22px;
  display: inline-flex;
  gap: 3px;
  box-shadow: var(--sombra-sm);
  border: 1px solid var(--gris-borde);
  flex-wrap: wrap;
}

.tab-btn {
  padding: 9px 18px;
  border: none;
  background: transparent;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  color: var(--gris-muted);
  font-size: 13px;
  transition: all var(--transition);
  font-family: var(--font-body);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--verde-oscuro); background: var(--verde-suave); }
.tab-btn.active {
  background: var(--verde-oscuro);
  color: white;
  box-shadow: 0 2px 8px rgba(26,92,46,0.25);
}

/* ===== CARDS ===== */
.card {
  background: white;
  border-radius: var(--radius-xl);
  box-shadow: var(--sombra-sm);
  overflow: hidden;
  margin-bottom: 20px;
  border: 1px solid var(--gris-borde);
  transition: box-shadow var(--transition);
}
.card:hover { box-shadow: var(--sombra-md); }

.card-header {
  padding: 16px 22px;
  border-bottom: 1px solid var(--gris-borde);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to right, var(--gris-surface), white);
}

.card-header h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--verde-oscuro);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-body { padding: 22px; }

/* KPI Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}

.kpi-card {
  background: white;
  border-radius: var(--radius-xl);
  padding: 20px;
  border: 1px solid var(--gris-borde);
  box-shadow: var(--sombra-sm);
  position: relative;
  overflow: hidden;
  transition: all var(--transition);
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--sombra-md); }

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}
.kpi-card.verde::before { background: linear-gradient(90deg, var(--verde-oscuro), var(--verde-claro)); }
.kpi-card.amarillo::before { background: linear-gradient(90deg, var(--amarillo), #ffd700); }
.kpi-card.azul::before { background: linear-gradient(90deg, #0284c7, #38bdf8); }
.kpi-card.rojo::before { background: linear-gradient(90deg, #dc2626, #f87171); }

.kpi-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--gris-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.kpi-value {
  font-size: 30px;
  font-weight: 800;
  color: var(--verde-oscuro);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.kpi-card.amarillo .kpi-value { color: #92400e; }
.kpi-card.azul .kpi-value { color: #0369a1; }
.kpi-card.rojo .kpi-value { color: #dc2626; }
.kpi-icon {
  position: absolute;
  right: 16px;
  bottom: 14px;
  font-size: 28px;
  opacity: 0.15;
}

/* ===== TABLA ===== */
table { width: 100%; border-collapse: collapse; }
thead tr { background: linear-gradient(to right, var(--gris-surface), #f0f4f1); }
th {
  padding: 11px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: var(--verde-oscuro);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 2px solid var(--gris-borde);
}
td {
  padding: 12px 16px;
  border-bottom: 1px solid #f0f4f1;
  font-size: 13px;
  vertical-align: middle;
}
tbody tr { transition: background var(--transition); }
tbody tr:hover { background: var(--gris-surface); }
tbody tr:last-child td { border-bottom: none; }

/* ===== BADGES ===== */
.badge {
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  display: inline-block;
}
.badge-verde { background: var(--verde-suave); color: var(--verde-oscuro); border: 1px solid rgba(26,92,46,0.2); }
.badge-amarillo { background: var(--amarillo-suave); color: #92400e; border: 1px solid rgba(245,200,0,0.4); }
.badge-gris { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
.badge-rojo { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
.badge-azul { background: #e0f2fe; color: #0369a1; border: 1px solid #93c5fd; }

/* ===== STOCK GRID ===== */
.stock-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}
.stock-item {
  border: 2px solid var(--gris-borde);
  border-radius: var(--radius-lg);
  padding: 16px;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  background: white;
}
.stock-item:hover { border-color: var(--verde-medio); box-shadow: var(--sombra-md); transform: translateY(-2px); }
.stock-item::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--verde-oscuro), var(--amarillo));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--transition);
}
.stock-item:hover::after { transform: scaleX(1); }
.stock-item-name {
  font-weight: 700;
  font-size: 13px;
  color: var(--gris-texto);
  margin-bottom: 8px;
  line-height: 1.3;
}
.stock-item-cat {
  font-size: 11px;
  color: var(--gris-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.stock-quantity {
  font-size: 22px;
  font-weight: 800;
  color: var(--verde-oscuro);
  font-variant-numeric: tabular-nums;
}
.stock-unit { font-size: 11px; color: var(--gris-muted); font-weight: 500; }

/* ===== FORMULARIOS ===== */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--gris-texto);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.form-control {
  width: 100%;
  padding: 10px 13px;
  border: 1.5px solid var(--gris-borde);
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--gris-texto);
  background: white;
  transition: all var(--transition);
  appearance: none;
}
.form-control:focus {
  outline: none;
  border-color: var(--verde-medio);
  box-shadow: 0 0 0 3px rgba(26,92,46,0.12);
}
.form-control:hover { border-color: #a7c4ae; }
textarea.form-control { resize: vertical; min-height: 80px; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  top: 80px;
  right: 20px;
  background: white;
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  box-shadow: var(--sombra-lg);
  z-index: 9999;
  border: 1px solid var(--gris-borde);
  border-left: 4px solid var(--verde-claro);
  font-size: 13px;
  font-weight: 500;
  animation: slideIn 0.25s ease-out;
  max-width: 300px;
}
@keyframes slideIn {
  from { transform: translateX(110%); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(3px);
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

.modal-box {
  background: white;
  padding: 28px;
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 420px;
  box-shadow: var(--sombra-lg);
  border-top: 4px solid var(--verde-oscuro);
  animation: slideUp 0.2s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity:0; }
  to   { transform: translateY(0);    opacity:1; }
}
.modal-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--verde-oscuro);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-footer {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}
.modal-footer .btn { flex: 1; justify-content: center; }

/* ===== LOGIN ===== */
.login-bg {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 30% 70%, rgba(245,200,0,0.12) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 30%, rgba(255,255,255,0.06) 0%, transparent 60%),
    linear-gradient(150deg, var(--verde-oscuro) 0%, var(--verde-medio) 50%, #1a6b35 100%);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.login-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='40' cy='40' r='20'/%3E%3C/g%3E%3C/svg%3E");
}

.login-card {
  background: white;
  border-radius: var(--radius-xl);
  padding: 40px 36px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  border-top: 5px solid var(--amarillo);
  position: relative;
  z-index: 1;
}

.login-logo-wrap {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo-wrap h2 {
  color: var(--verde-oscuro);
  font-size: 17px;
  font-weight: 700;
  margin-top: 12px;
  margin-bottom: 2px;
}
.login-logo-wrap p {
  color: var(--gris-muted);
  font-size: 12px;
}

/* ===== DIVIDER ===== */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gris-borde), transparent);
  margin: 18px 0;
}

/* ===== SECTION HEADER ===== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}
.section-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--verde-oscuro);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-subtitle {
  font-size: 12px;
  color: var(--gris-muted);
  font-weight: 400;
  margin-top: 2px;
}

/* ===== EMPTY STATE ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px;
  color: var(--gris-muted);
  text-align: center;
}
.empty-state-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.5; }
.empty-state h4 { font-size: 15px; font-weight: 600; color: var(--gris-texto); margin-bottom: 6px; }
.empty-state p { font-size: 13px; max-width: 260px; }

/* ===== ITEM ROW ===== */
.item-row {
  display: grid;
  grid-template-columns: 1fr 90px auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  background: var(--gris-surface);
  padding: 8px 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--gris-borde);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .header { padding: 0 16px; }
  .container { padding: 16px 12px; }
  .tabs-wrap { width: 100%; }
  .tab-btn { padding: 8px 12px; font-size: 12px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .login-card { padding: 28px 22px; }
  .stock-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}

/* ===== SCROLL ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--gris-bg); }
::-webkit-scrollbar-thumb { background: var(--gris-borde); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #a7c4ae; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>

<script>
// ==================== LOGO ====================
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <circle cx="50" cy="50" r="48" fill="#1a5c2e" stroke="#f5c800" stroke-width="3"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#f5c800" stroke-width="1.5"/>
  <!-- L -->
  <path d="M22 30 L22 70 L38 70 L38 62 L30 62 L30 30 Z" fill="white"/>
  <!-- C curva grande izquierda -->
  <path d="M50 22 C34 22 24 34 24 50 C24 66 34 78 50 78 L50 70 C38 70 32 61 32 50 C32 39 38 30 50 30 Z" fill="#f5c800"/>
  <!-- B letra derecha -->
  <path d="M48 30 L48 70 L60 70 C68 70 74 65 74 58 C74 53 71 50 67 48 C70 46 72 43 72 38 C72 33 68 30 60 30 Z M56 38 L59 38 C62 38 64 40 64 43 C64 46 62 48 59 48 L56 48 Z M56 55 L60 55 C63 55 66 57 66 60 C66 63 63 65 60 65 L56 65 Z" fill="white"/>
</svg>`;

const LOGO_SVG_LARGE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
  <circle cx="50" cy="50" r="48" fill="#1a5c2e" stroke="#f5c800" stroke-width="3"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#f5c800" stroke-width="1.5"/>
  <path d="M22 30 L22 70 L38 70 L38 62 L30 62 L30 30 Z" fill="white"/>
  <path d="M50 22 C34 22 24 34 24 50 C24 66 34 78 50 78 L50 70 C38 70 32 61 32 50 C32 39 38 30 50 30 Z" fill="#f5c800"/>
  <path d="M48 30 L48 70 L60 70 C68 70 74 65 74 58 C74 53 71 50 67 48 C70 46 72 43 72 38 C72 33 68 30 60 30 Z M56 38 L59 38 C62 38 64 40 64 43 C64 46 62 48 59 48 L56 48 Z M56 55 L60 55 C63 55 66 57 66 60 C66 63 63 65 60 65 L56 65 Z" fill="white"/>
</svg>`;

// ==================== ESTADO ====================
let STATE = { users: [], stock: [], requests: [] };

function saveData() {
  try { localStorage.setItem('lb_v3_data', JSON.stringify(STATE)); } catch(e) {}
}

function loadData() {
  try {
    const d = localStorage.getItem('lb_v3_data');
    if (d) STATE = JSON.parse(d);
  } catch(e) {}
}

function initData() {
  loadData();
  if (STATE.users.length === 0) {
    STATE.users = [{

// ==================== UTILIDADES ====================
function toast(msg, type='success') {
  const colors = { success: '#1a5c2e', error: '#dc2626', info: '#0284c7' };
  const icons  = { success: '✅', error: '❌', info: 'ℹ️' };
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderLeftColor = colors[type] || colors.success;
  t.innerHTML = `${icons[type]||'✅'} <span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(110%)'; t.style.transition='all 0.3s'; setTimeout(()=>t.remove(), 300); }, 2600);
}

function getCurrentUser() {
  try {
    const s = localStorage.getItem('lb_v3_session');
    if (!s) return null;
    return STATE.users.find(u => u.id === JSON.parse(s).id) || null;
  } catch(e) { return null; }
}

function login(username, password) {
  const user = STATE.users.find(u => u.username.toLowerCase() === username.toLowerCase());
  if (user && user.password === password) {
    try { localStorage.setItem('lb_v3_session', JSON.stringify({id:user.id})); } catch(e) {}
    return user;
  }
  return null;
}

function logout() {
  try { localStorage.removeItem('lb_v3_session'); } catch(e) {}
  render();
}

function sendToWhatsApp(req) {
  const phone = "573166357452";

`📋 NUEVA SOLICITUD - Colegio Lauretta Bender

${req.items.map(i=>`• ${i.matName}: ${i.quantity} ${i.matUnit}`).join('\n')}

  window.open(`https://wa.me/${phone}?text=${message}`, '_blank');

}

// ==================== RENDER PRINCIPAL ====================
function render() {
  const user = getCurrentUser();
  const app = document.getElementById('app');
  if (!user) { app.innerHTML = renderLogin(); return; }
  if (user.role === 'admin') {
    app.innerHTML = renderAdminLayout(user);
    setTimeout(()=>{ const btns=document.querySelectorAll('.tab-btn'); if(btns[0]) btns[0].click(); },10);
  } else {
    app.innerHTML = renderTeacherLayout(user);
    setTimeout(()=>{ const btns=document.querySelectorAll('.tab-btn'); if(btns[0]) btns[0].click(); },10);
  }
}

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const user = login(u, p);
  if (user) { render(); }
  else {
    const err = document.getElementById('login-error');
    err.style.display = 'block';
    err.innerHTML = '⚠️ Usuario o contraseña incorrectos';
  }
}

function showAdminTab(tab, el) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  const content = document.getElementById('tab-content');
  if(tab==='dashboard') content.innerHTML = renderDashboard();
  if(tab==='stock')     content.innerHTML = renderStockTab();
  if(tab==='requests')  content.innerHTML = renderRequestsTab();
  if(tab==='users')     content.innerHTML = renderUsersTab();
}

// ===== DASHBOARD =====
function renderDashboard() {
  const totalUnits = STATE.stock.reduce((a,b)=>a+b.quantity,0);
  const pendingReqs = STATE.requests.filter(r=>r.status==='pending').length;
  const lowStock = STATE.stock.filter(i=>i.quantity<=5).length;

  return `
  <div class="section-header">
    <div>
      <div class="section-title">📊 Panel Principal</div>
      <div class="section-subtitle">Resumen general del sistema — ${new Date().toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card verde">
      <div class="kpi-label">Total Unidades</div>
      <div class="kpi-value">${totalUnits}</div>
      <div class="kpi-icon">📦</div>
    </div>
    <div class="kpi-card amarillo">
      <div class="kpi-label">Tipos de Material</div>
      <div class="kpi-value">${STATE.stock.length}</div>
      <div class="kpi-icon">🗂️</div>
    </div>
    <div class="kpi-card azul">
      <div class="kpi-label">Solicitudes</div>
      <div class="kpi-value">${STATE.requests.length}</div>
      <div class="kpi-icon">📋</div>
    </div>
    <div class="kpi-card ${lowStock>0?'rojo':'verde'}">
      <div class="kpi-label">Stock Bajo (≤5)</div>
      <div class="kpi-value">${lowStock}</div>
      <div class="kpi-icon">⚠️</div>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:18px;">
    <div class="card">
      <div class="card-header">
        <h3>📦 Estado del Inventario</h3>
      </div>
      <div class="card-body" style="padding:0;">
        <table>
          <thead><tr><th>Material</th><th>Cant.</th><th>Estado</th></tr></thead>
          <tbody>
            ${STATE.stock.map(i=>`
              <tr>
                <td><span style="margin-right:6px;">${i.icon||'📦'}</span>${i.name}</td>
                <td><strong style="font-variant-numeric:tabular-nums;">${i.quantity}</strong> <span style="font-size:11px;color:#9ca3af;">${i.unit}</span></td>
                <td>${i.quantity<=5 ? '<span class="badge badge-rojo">⚠️ Bajo</span>' : i.quantity<=20 ? '<span class="badge badge-amarillo">Medio</span>' : '<span class="badge badge-verde">✔ OK</span>'}</td>

      <div class="card-header">
        <h3>📋 Últimas Solicitudes</h3>

          ? `<div class="empty-state"><div class="empty-state-icon">📭</div><h4>Sin solicitudes aún</h4><p>Las solicitudes de docentes aparecerán aquí.</p></div>`
          : `<table><thead><tr><th>Docente</th><th>Sección</th><th>Estado</th></tr></thead><tbody>

// ===== INVENTARIO =====
function renderStockTab() {
  return `
  <div class="section-header">
    <div>
      <div class="section-title">📦 Inventario de Materiales</div>
      <div class="section-subtitle">${STATE.stock.length} tipos de material registrados</div>
    </div>
    <button onclick="showAddStockModal()" class="btn btn-amarillo">+ Agregar Material</button>
  </div>

  <div class="stock-grid">
    ${STATE.stock.map(i=>`
      <div class="stock-item">
        <div style="font-size:26px; margin-bottom:8px;">${i.icon||'📦'}</div>
        <div class="stock-item-name">${i.name}</div>
        <div class="stock-item-cat"><span class="badge badge-gris">${i.category}</span></div>
        <div style="display:flex; align-items:baseline; gap:4px;">
          <div class="stock-quantity">${i.quantity}</div>
          <div class="stock-unit">${i.unit}</div>
        </div>
        <div style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap;">
          <button onclick="showEditStock(${i.id})" class="btn btn-outline btn-sm">✏️ Editar</button>
          <button onclick="deleteStock(${i.id})" class="btn btn-ghost btn-sm">🗑️</button>
        </div>
      </div>`).join('')}
  </div>`;
}

function showAddStockModal() {
  const icons = ['📄','✏️','🎨','✂️','🖍️','🔧','📐','📏','🗂️','📚','🖊️','📌'];
  document.body.insertAdjacentHTML('beforeend', `
  <div id="modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-title">📦 Agregar Material</div>
      <div class="form-group">
        <label class="form-label">Nombre del material</label>
        <input id="sm-name" class="form-control" placeholder="Ej: Papel bond carta">
      </div>
      <div class="form-group">
        <label class="form-label">Categoría</label>
        <select id="sm-cat" class="form-control">
          <option>Papelería</option><option>Escritura</option><option>Arte</option>
          <option>Herramientas</option><option>Tecnología</option><option>Otro</option>
        </select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">Cantidad</label>
          <input id="sm-qty" type="number" value="10" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Unidad</label>
          <input id="sm-unit" class="form-control" placeholder="Ej: Resma">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Ícono</label>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          ${icons.map(ic=>`<button onclick="selectIcon('${ic}')" class="btn btn-ghost btn-sm icon-pick" data-icon="${ic}" style="font-size:18px; padding:6px 8px;">${ic}</button>`).join('')}
        </div>
        <input id="sm-icon" type="hidden" value="📦">
      </div>
      <div class="modal-footer">
        <button onclick="closeModal()" class="btn btn-ghost">Cancelar</button>
        <button onclick="addStock()" class="btn btn-primary">Guardar Material</button>
      </div>
    </div>
  </div>`);
}

function selectIcon(ic) {
  document.getElementById('sm-icon').value = ic;
  document.querySelectorAll('.icon-pick').forEach(b=>{ b.style.background=''; b.style.borderColor=''; });
  const picked = document.querySelector(`.icon-pick[data-icon="${ic}"]`);
  if(picked) { picked.style.background='#d4edda'; picked.style.borderColor='#1a5c2e'; }
}

function addStock() {
  const name = document.getElementById('sm-name').value.trim();
  const cat  = document.getElementById('sm-cat').value;
  const qty  = parseInt(document.getElementById('sm-qty').value);
  const unit = document.getElementById('sm-unit').value.trim() || 'Unidad';
  const icon = document.getElementById('sm-icon').value || '📦';
  if (!name) return toast('Escribe el nombre del material','error');
  STATE.stock.push({ id:Date.now(), name, category:cat, quantity:qty||0, unit, icon });
  saveData();
  closeModal();
  toast('Material agregado correctamente');
  document.getElementById('tab-content').innerHTML = renderStockTab();
}

function showEditStock(id) {
  const item = STATE.stock.find(s=>s.id===id);
  if(!item) return;
  document.body.insertAdjacentHTML('beforeend', `
  <div id="modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-title">✏️ Editar Material</div>
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input id="em-name" class="form-control" value="${item.name}">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">Cantidad</label>
          <input id="em-qty" type="number" value="${item.quantity}" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Unidad</label>
          <input id="em-unit" class="form-control" value="${item.unit}">
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeModal()" class="btn btn-ghost">Cancelar</button>
        <button onclick="updateStock(${id})" class="btn btn-primary">Actualizar</button>
      </div>
    </div>
  </div>`);
}

function updateStock(id) {
  const item = STATE.stock.find(s=>s.id===id);
  if(!item) return;
  item.name = document.getElementById('em-name').value.trim() || item.name;
  item.quantity = parseInt(document.getElementById('em-qty').value)||0;
  item.unit = document.getElementById('em-unit').value.trim() || item.unit;
  saveData();
  closeModal();
  toast('Material actualizado');
  document.getElementById('tab-content').innerHTML = renderStockTab();
}

function deleteStock(id) {
  if(!confirm('¿Eliminar este material del inventario?')) return;
  STATE.stock = STATE.stock.filter(s=>s.id!==id);
  saveData();
  toast('Material eliminado');
  document.getElementById('tab-content').innerHTML = renderStockTab();
}

function renderRequestsTab() {
  return `
  <div class="section-header">
    <div>
      <div class="section-title">📋 Solicitudes Recibidas</div>
      <div class="section-subtitle">${STATE.requests.length} solicitudes en total</div>
    </div>
  </div>
  <div class="card">
    <div class="card-body" style="padding:0;">
      ${STATE.requests.length===0
        ? `<div class="empty-state"><div class="empty-state-icon">📭</div><h4>No hay solicitudes</h4><p>Las solicitudes enviadas por los docentes aparecerán aquí.</p></div>`
        : `<table>
            <thead><tr><th>Docente</th><th>Sección</th><th>Materiales</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
              ${STATE.requests.slice().reverse().map(r=>`
                <tr>
                  <td><strong>${r.userName}</strong></td>
                  <td><span class="badge badge-gris">${r.userSection}</span></td>
                  <td style="max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${r.items.map(i=>`${i.matName} (${i.quantity})`).join(', ')}</td>
                  <td style="color:#6b7280; font-size:12px;">${r.reason.substring(0,40)}${r.reason.length>40?'…':''}</td>
                  <td>${r.status==='approved'?'<span class="badge badge-verde">✔ Aprobada</span>':r.status==='rejected'?'<span class="badge badge-rojo">✗ Rechazada</span>':'<span class="badge badge-amarillo">⏳ Pendiente</span>'}</td>
                  <td>
                    <div style="display:flex; gap:5px; flex-wrap:wrap;">
                      ${r.status==='pending'?`
                        <button onclick="updateReqStatus(${r.id},'approved')" class="btn btn-success btn-sm">✔</button>
                        <button onclick="updateReqStatus(${r.id},'rejected')" class="btn btn-danger btn-sm">✗</button>`:''}
                      <button onclick='sendToWhatsApp(${JSON.stringify(r)})' class="btn btn-blue btn-sm">📱</button>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>`}
    </div>
  </div>`;
}

function updateReqStatus(id, status) {
  const req = STATE.requests.find(r=>r.id===id);
  if(req) { req.status=status; saveData(); toast(status==='approved'?'Solicitud aprobada ✔':'Solicitud rechazada'); document.getElementById('tab-content').innerHTML = renderRequestsTab(); }
}

  document.body.insertAdjacentHTML('beforeend', `

        <div class="form-group">

      </div>

function createUser() {
  const name = document.getElementById('nu-name').value.trim();
  const username = document.getElementById('nu-user').value.trim();
  const pass = document.getElementById('nu-pass').value.trim();
  const section = document.getElementById('nu-section').value;
  if(!name||!username||!pass) return toast('Completa todos los campos','error');
  if(STATE.users.find(u=>u.username===username)) return toast('Ese usuario ya existe','error');
  STATE.users.push({ id:Date.now(), name, username, password:pass, role:'teacher', section });
  saveData();
  closeModal();
  toast('Usuario creado exitosamente');
  document.getElementById('tab-content').innerHTML = renderUsersTab();
}

function deleteUser(id) {
  if(!confirm('¿Eliminar este usuario?')) return;
  STATE.users = STATE.users.filter(u=>u.id!==id);
  saveData();
  toast('Usuario eliminado');
  document.getElementById('tab-content').innerHTML = renderUsersTab();
}

function closeModal() { document.getElementById('modal')?.remove(); }

function showTeacherTab(tab, el) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  const c = document.getElementById('tab-content');
  if(tab==='request') c.innerHTML = renderRequestForm();
  if(tab==='mine')    c.innerHTML = renderMyRequests();
}

let rid = 1;
function renderRequestForm() {
  rid = 1;
  return `
  <div style="max-width:600px; margin:0 auto;">
    <div class="card">
      <div class="card-header">
        <h3>📝 Nueva Solicitud de Materiales</h3>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">Materiales solicitados</label>
          <div id="items-list">
            <div class="item-row">
              <select id="mat-0" class="form-control">${STATE.stock.map(i=>`<option value="${i.id}">${i.icon||'📦'} ${i.name}</option>`).join('')}</select>
              <input type="number" id="qty-0" value="1" min="1" class="form-control">
              <span style="font-size:12px; color:#9ca3af; padding:0 4px;">und</span>
            </div>
          </div>
          <button onclick="addItemRow()" class="btn btn-outline btn-sm" style="margin-top:8px;">+ Agregar otro material</button>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label class="form-label">Motivo de la solicitud</label>
          <textarea id="reason" class="form-control" placeholder="Describe para qué actividad o clase necesitas estos materiales..."></textarea>
        </div>

        <button onclick="submitRequest()" class="btn btn-primary btn-lg" style="width:100%; justify-content:center;">
          📤 Enviar Solicitud
        </button>
      </div>
    </div>
  </div>`;
}

function addItemRow() {
  const c = document.getElementById('items-list');
  const d = document.createElement('div');
  d.className = 'item-row';
  d.innerHTML = `
    <select id="mat-${rid}" class="form-control">${STATE.stock.map(i=>`<option value="${i.id}">${i.icon||'📦'} ${i.name}</option>`).join('')}</select>
    <input type="number" id="qty-${rid}" value="1" min="1" class="form-control">
    <button onclick="this.closest('.item-row').remove()" class="btn btn-ghost btn-sm">✕</button>`;
  c.appendChild(d);
  rid++;
}

function submitRequest() {
  const user = getCurrentUser();
  const reason = document.getElementById('reason').value.trim();
  if(!reason) { toast('Escribe el motivo de la solicitud','error'); return; }

  const items = [];
  document.querySelectorAll('#items-list .item-row').forEach(row=>{
    const sel = row.querySelector('select');
    const inp = row.querySelector('input[type=number]');
    if(!sel||!inp) return;
    const mat = STATE.stock.find(s=>s.id==sel.value);
    if(mat) items.push({ matId:mat.id, matName:mat.name, matUnit:mat.unit, quantity:parseInt(inp.value)||1 });
  });
  if(items.length===0) { toast('Agrega al menos un material','error'); return; }

  const newReq = {
    id: Date.now(),
    userId: user.id,
    userName: user.name,
    userSection: user.section||'primaria',
    items, reason,
    status: 'pending',
    date: Date.now()
  };
  STATE.requests.push(newReq);
  saveData();
  toast('¡Solicitud enviada exitosamente!');
  setTimeout(()=>sendToWhatsApp(newReq), 700);
  document.querySelector('.tab-btn:nth-child(2)').click();
}

function renderMyRequests() {
  const user = getCurrentUser();
  const my = STATE.requests.filter(r=>r.userId===user.id).slice().reverse();
  return `
  <div class="section-header">
    <div>
      <div class="section-title">📋 Mis Solicitudes</div>
      <div class="section-subtitle">${my.length} solicitudes enviadas</div>
    </div>
  </div>
  <div class="card">
    <div class="card-body" style="padding:0;">
      ${my.length===0
        ? `<div class="empty-state"><div class="empty-state-icon">📭</div><h4>Aún no has enviado solicitudes</h4><p>Ve a "Nueva Solicitud" para solicitar materiales.</p></div>`
        : `<table>
            <thead><tr><th>Materiales</th><th>Motivo</th><th>Estado</th><th>WhatsApp</th></tr></thead>
            <tbody>
              ${my.map(r=>`
                <tr>
                  <td style="max-width:200px;">${r.items.map(i=>`<span style="display:inline-block; margin:2px; font-size:11px; background:#f0f4f1; border-radius:5px; padding:2px 6px;">${i.matName}</span>`).join('')}</td>
                  <td style="color:#6b7280; font-size:12px;">${r.reason.substring(0,50)}${r.reason.length>50?'…':''}</td>
                  <td>${r.status==='approved'?'<span class="badge badge-verde">✔ Aprobada</span>':r.status==='rejected'?'<span class="badge badge-rojo">✗ Rechazada</span>':'<span class="badge badge-amarillo">⏳ Pendiente</span>'}</td>
                  <td><button class="btn btn-blue btn-sm" onclick='sendToWhatsApp(${JSON.stringify(r)})'>📱 Enviar</button></td>
                </tr>`).join('')}
            </tbody>
          </table>`}
    </div>
  </div>`;
}

// ==================== INICIO ====================
initData();
render();
</script>
</body>
</html>
